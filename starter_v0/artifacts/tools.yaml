# starter_v0 — tool declarations (v3 optimized).
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi làm rõ hoặc xin xác nhận từ người dùng khi thiếu thông tin hoặc trước hành động gửi."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi hoặc lời xin xác nhận gửi cho người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời: 'text' để hỏi thông tin thiếu, 'yes_no' để xin xác nhận trước hành động gửi"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn nếu có"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây của một người dùng hoặc tài khoản cụ thể trên mạng xã hội (VD: sama, elonmusk, karpathy)."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản (handle)"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng cần lấy"}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm các bài đăng/tweet trên mạng xã hội theo từ khóa hoặc chủ đề chung."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc chủ đề tìm kiếm"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp: 'Latest' cho mới nhất, 'Top' cho phổ biến/hot nhất"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin hoặc tin tức trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc truy vấn tra cứu"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại: 'news' cho tin tức/thời sự, 'general' cho tra cứu chung"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: 'day' cho hôm nay, 'week' cho tuần này"}
        max_results: {type: integer, default: 5, description: "Số lượng kết quả tối đa"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung chi tiết từ một đường dẫn URL cụ thể."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL cụ thể cần đọc"}
      required: [url]

  - name: tech_news
    description: "Lấy các bài công nghệ hoặc AI mới từ Hacker News. Dùng khi người dùng cần top story hoặc tin công nghệ mới; không dùng để tìm kiếm web tổng quát. Không cần API key."
    parameters:
      type: object
      properties:
        mode: {type: string, enum: [top, new], default: "top", description: "top: bài đang được xếp hạng cao; new: bài mới đăng"}
        limit: {type: integer, default: 5, description: "Số bài trả về, từ 1 đến 10"}
        query: {type: string, default: "", description: "Từ khóa tùy chọn để lọc trong tiêu đề/nội dung, ví dụ AI hoặc OpenAI"}
      required: [mode, limit]

  - name: format
    description: "Trình bày các thông tin/kết quả nghiên cứu đã thu thập thành văn bản báo cáo theo định dạng mong muốn."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách các thông tin cần trình bày"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn mẫu định dạng"}
        headline: {type: string, default: "", description: "Tiêu đề của báo cáo"}
      required: [items, template]

  # ---------------- Bonus / Special tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản hoặc báo cáo ra kênh ngoài (chỉ gọi sau khi đã xác nhận với người dùng qua clarify)."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung cần gửi"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm kiếm thông tin trong các tài liệu quy định và chính sách nội bộ của công ty."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn cần tìm trong quy định"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm chính sách cần tra cứu"}
        top_k: {type: integer, default: 3, description: "Số lượng quy định lấy ra"}
      required: [query]

  - name: papers
    description: "Tìm kiếm các bài báo nghiên cứu khoa học trên arXiv."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc chủ đề nghiên cứu"}
        max_results: {type: integer, default: 5, description: "Số lượng bài báo tối đa"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Tiêu chí sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung toàn văn bản của một bài báo khoa học từ arXiv URL hoặc arXiv ID."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "Địa chỉ URL hoặc ID của bài báo arXiv"}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa cần lấy"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự tối đa"}
      required: [arxiv_url]
