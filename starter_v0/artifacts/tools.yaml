# starter_v0 — tool declarations (v3 optimized).
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Dùng khi không thể thực hiện yêu cầu an toàn/chính xác vì thiếu thông tin bắt buộc, hoặc trước hành động có tác động bên ngoài. Không dùng nếu thông tin cần thiết đã có hoặc có thể trả lời trực tiếp. Mặc định response_type=text; dùng yes_no cho bước xác nhận; chỉ dùng choice khi có các lựa chọn rõ ràng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi hoặc lời xin xác nhận gửi cho người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời: 'text' để hỏi thông tin thiếu, 'yes_no' để xin xác nhận trước hành động gửi"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn nếu có"}
      required: [question]

  - name: timeline
    description: "Lấy bài đăng X/Twitter gần đây của MỘT tài khoản cụ thể. Dùng khi người dùng nêu tên tài khoản/nhân vật; chuyển tên phổ biến sang handle khi chắc chắn (Sam Altman→sama, Elon Musk→elonmusk, Andrej Karpathy→karpathy). Không dùng để tìm thảo luận theo chủ đề; dùng social_search cho trường hợp đó. screenname là bắt buộc; limit mặc định 5."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản (handle)"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng cần lấy"}
      required: [screenname]

  - name: social_search
    description: "Tìm các bài đăng X/Twitter theo chủ đề hoặc từ khóa. Dùng khi người dùng hỏi mọi người đang nói gì trên Twitter/X; không dùng để lấy timeline của một tài khoản (dùng timeline) hay tìm web diện rộng (dùng lookup). search_type mặc định Latest; chỉ đặt Top khi người dùng yêu cầu top/phổ biến. limit mặc định 5."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc chủ đề tìm kiếm"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp: 'Latest' cho mới nhất, 'Top' cho phổ biến/hot nhất"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng"}
      required: [query]

  - name: lookup
    description: "Tìm kiếm web diện rộng. Dùng cho tin tức hoặc nguồn ngoài Hacker News/X; không dùng để đọc một URL đã biết (dùng fetch), lấy tin chỉ từ Hacker News (dùng tech_news), hoặc tìm bài đăng X (dùng social_search). topic mặc định general; đặt topic=news cho tin tức. timeframe mặc định week; day=today/hôm nay, week=tuần này, month=tháng này, year=năm nay. max_results mặc định 5."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc truy vấn tra cứu"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại: 'news' cho tin tức/thời sự, 'general' cho tra cứu chung"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: 'day' cho hôm nay, 'week' cho tuần này"}
        max_results: {type: integer, default: 5, description: "Số lượng kết quả tối đa"}
      required: [query]

  - name: fetch
    description: "Đọc và trích nội dung một URL cụ thể thành Markdown. Dùng khi người dùng đã cung cấp URL hoặc cần đọc chi tiết một kết quả; không dùng để tìm URL mới (dùng lookup/tech_news) hoặc khi URL bị thiếu (dùng clarify). url là bắt buộc."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL cụ thể cần đọc"}
      required: [url]

  - name: tech_news
    description: "Lấy tin công nghệ/AI từ Hacker News. Dùng khi người dùng cần top story hoặc bài công nghệ mới trên Hacker News; không dùng để tìm web diện rộng (lookup), đọc URL cụ thể (fetch), hay tìm bài X/Twitter (social_search). mode=top mặc định cho bài xếp hạng cao; mode=new cho bài mới. limit mặc định 5, từ 1–10. query là từ khóa lọc tùy chọn. Không cần API key."
    parameters:
      type: object
      properties:
        mode: {type: string, enum: [top, new], default: "top", description: "top: bài đang được xếp hạng cao; new: bài mới đăng"}
        limit: {type: integer, default: 5, description: "Số bài trả về, từ 1 đến 10"}
        query: {type: string, default: "", description: "Từ khóa tùy chọn để lọc trong tiêu đề/nội dung, ví dụ AI hoặc OpenAI"}
      required: [mode, limit]

  - name: format
    description: "Định dạng danh sách items đã có thành Markdown digest. Dùng sau khi đã thu thập dữ liệu từ tool khác hoặc khi người dùng cung cấp items; không dùng để tìm kiếm/đọc nguồn mới. template mặc định sections; brief giới hạn 5 mục, bullets là danh sách ngắn, thread là dạng chuỗi bài đăng, daily_ai_vn là bản tin tiếng Việt. headline là tiêu đề tùy chọn."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách các thông tin cần trình bày"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn mẫu định dạng"}
        headline: {type: string, default: "", description: "Tiêu đề của báo cáo"}
      required: [items, template]

  # ---------------- Bonus / Special tools ----------------
  - name: send
    description: "Gửi nội dung lên Telegram; đây là action tool có tác động bên ngoài. Chỉ gọi sau khi người dùng xác nhận rõ ràng nội dung và việc gửi. Trước xác nhận, gọi clarify với response_type=yes_no và KHÔNG gọi send. Khi gọi thật phải đặt confirmed=true; confirmed mặc định false và chỉ trả needs_confirmation."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung cần gửi"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm quy định trong tài liệu chính sách nội bộ. Dùng cho câu hỏi về policy của công ty; không dùng để tìm tin tức/công nghệ bên ngoài. policy_area mặc định all, top_k mặc định 3."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn cần tìm trong quy định"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm chính sách cần tra cứu"}
        top_k: {type: integer, default: 3, description: "Số lượng quy định lấy ra"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học trên arXiv. Dùng cho yêu cầu nghiên cứu học thuật; không dùng cho tin tức phổ thông hoặc để đọc toàn văn một paper đã xác định (dùng paper_text). max_results mặc định 5; sort_by mặc định relevance."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc chủ đề nghiên cứu"}
        max_results: {type: integer, default: 5, description: "Số lượng bài báo tối đa"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Tiêu chí sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Tải và trích text từ PDF arXiv theo arXiv ID/URL. Dùng khi đã có paper cụ thể và cần đọc nội dung; không dùng để tìm paper mới (dùng papers). max_pages mặc định 5, max_chars mặc định 8000. Tool ghi file PDF/text cục bộ, không có tác động bên ngoài."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "Địa chỉ URL hoặc ID của bài báo arXiv"}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa cần lấy"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự tối đa"}
      required: [arxiv_url]
